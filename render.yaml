services:
  - type: web
    name: shree-venkateshwara-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
  - type: web
    name: shree-website
    runtime: static
    buildCommand: node scripts/build-static-site.js
    staticPublishPath: dist
